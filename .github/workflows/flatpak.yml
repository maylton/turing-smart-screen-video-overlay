name: Flatpak

on:
  pull_request:
    paths:
      - 'packaging/flatpak/**'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packaging/flatpak/**'
      - '.github/workflows/flatpak.yml'

permissions:
  contents: write

jobs:
  build-flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Build Flatpak repository
        run: |
          flatpak-builder \
            --user \
            --force-clean \
            --install-deps-from=flathub \
            --repo=flatpak-repo \
            build-flatpak \
            packaging/flatpak/io.github.turing.SmartScreen.yml

      - name: Smoke-check exported app
        run: |
          test -x build-flatpak/files/bin/turing-smart-screen
          test -f build-flatpak/files/share/applications/io.github.turing.SmartScreen.desktop
          test -f build-flatpak/files/share/metainfo/io.github.turing.SmartScreen.metainfo.xml
          test -f build-flatpak/files/share/turing-smart-screen/configure-gtk.py

      - name: Build single-file bundle
        run: |
          flatpak build-bundle \
            flatpak-repo \
            Turing-Smart-Screen-0.9.0-dev1-flatpak1-x86_64.flatpak \
            io.github.turing.SmartScreen \
            stable

      - uses: actions/upload-artifact@v4
        with:
          name: Turing-Smart-Screen-Flatpak
          path: Turing-Smart-Screen-0.9.0-dev1-flatpak1-x86_64.flatpak

      - name: Publish first Flatpak preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.0-dev1-flatpak1
          name: Turing Smart Screen 0.9.0-dev1 Flatpak Preview 1
          prerelease: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: Turing-Smart-Screen-0.9.0-dev1-flatpak1-x86_64.flatpak
