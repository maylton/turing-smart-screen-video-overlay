name: Apply discrete AMD GPU patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/agent-apply-discrete-amd.yml

permissions:
  contents: write

jobs:
  patch-selection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: agent/prefer-discrete-amd-gpu
          fetch-depth: 0

      - name: Prefer the AMD GPU with the largest VRAM
        run: |
          python - <<'PY'
          from pathlib import Path

          sensors = Path("library/sensors/sensors_python.py")
          text = sensors.read_text(encoding="utf-8")

          old_class = '''class GpuAmd(sensors.Gpu):\n    @staticmethod\n    def stats() -> Tuple[\n'''
          new_class = '''class GpuAmd(sensors.Gpu):\n    selected_index = -1\n\n    @staticmethod\n    def preferred_linux_gpu_index() -> int:\n        \"\"\"Select the AMD adapter with the largest dedicated VRAM.\n\n        Ryzen processors may expose an integrated AMD GPU before a discrete\n        Radeon card. pyamdgpuinfo indexes devices but does not choose one for\n        the caller, so using index 0 can monitor the iGPU instead of the card\n        driving games. The largest VRAM size is a stable proxy for the\n        dedicated adapter; ties and unavailable sizes keep the first device.\n        \"\"\"\n        if not pyamdgpuinfo:\n            return -1\n\n        count = pyamdgpuinfo.detect_gpus()\n        if count <= 0:\n            return -1\n\n        best_index = 0\n        best_vram = -1\n        for index in range(count):\n            try:\n                gpu = pyamdgpuinfo.get_gpu(index)\n                memory_info = getattr(gpu, \"memory_info\", {}) or {}\n                vram_size = int(memory_info.get(\"vram_size\", 0) or 0)\n            except Exception:\n                vram_size = 0\n\n            if vram_size > best_vram:\n                best_index = index\n                best_vram = vram_size\n\n        return best_index\n\n    @staticmethod\n    def linux_gpu():\n        if not pyamdgpuinfo:\n            raise RuntimeError(\"pyamdgpuinfo is not available\")\n\n        if GpuAmd.selected_index < 0:\n            GpuAmd.selected_index = GpuAmd.preferred_linux_gpu_index()\n        if GpuAmd.selected_index < 0:\n            raise RuntimeError(\"No AMD GPU was detected\")\n\n        return pyamdgpuinfo.get_gpu(GpuAmd.selected_index)\n\n    @staticmethod\n    def stats() -> Tuple[\n'''
          if text.count(old_class) != 1:
              raise SystemExit("Could not find the GpuAmd class insertion point")
          text = text.replace(old_class, new_class, 1)

          old_stats = '''            pyamdgpuinfo.detect_gpus()\n            amd_gpu = pyamdgpuinfo.get_gpu(0)\n'''
          if text.count(old_stats) != 1:
              raise SystemExit("Could not find the AMD stats device lookup")
          text = text.replace(old_stats, '            amd_gpu = GpuAmd.linux_gpu()\n', 1)

          old_frequency = '''            if pyamdgpuinfo:\n                pyamdgpuinfo.detect_gpus()\n                return pyamdgpuinfo.get_gpu(0).query_sclk() / 1000000\n'''
          new_frequency = '''            if pyamdgpuinfo:\n                return GpuAmd.linux_gpu().query_sclk() / 1000000\n'''
          if text.count(old_frequency) != 1:
              raise SystemExit("Could not find the AMD frequency device lookup")
          text = text.replace(old_frequency, new_frequency, 1)

          old_available = '''        try:\n            if pyamdgpuinfo and pyamdgpuinfo.detect_gpus() > 0:\n                return True\n            elif pyadl and len(pyadl.ADLManager.getInstance().getDevices()) > 0:\n                return True\n            else:\n                return False\n        except:\n            return False\n'''
          new_available = '''        try:\n            if pyamdgpuinfo:\n                selected_index = GpuAmd.preferred_linux_gpu_index()\n                if selected_index >= 0:\n                    GpuAmd.selected_index = selected_index\n                    selected_gpu = pyamdgpuinfo.get_gpu(selected_index)\n                    try:\n                        vram_mib = int(selected_gpu.memory_info[\"vram_size\"]) / 1024 / 1024\n                        logger.info(\n                            f\"Selected AMD GPU index {selected_index} \"\n                            f\"with {vram_mib:.0f} MiB VRAM\"\n                        )\n                    except Exception:\n                        logger.info(f\"Selected AMD GPU index {selected_index}\")\n                    return True\n\n            if pyadl and len(pyadl.ADLManager.getInstance().getDevices()) > 0:\n                return True\n            return False\n        except:\n            return False\n'''
          if text.count(old_available) != 1:
              raise SystemExit("Could not find the AMD availability block")
          text = text.replace(old_available, new_available, 1)
          sensors.write_text(text, encoding="utf-8")

          checkup = Path("gtk-checkup.py")
          text = checkup.read_text(encoding="utf-8")
          required = '        "tests/test_gpu_dependency_detection.py",\n'
          if text.count(required) != 1:
              raise SystemExit("Could not find the GPU dependency test file entry")
          text = text.replace(
              required,
              required + '        "tests/test_amd_gpu_selection.py",\n',
              1,
          )
          module = '            "tests.test_gpu_dependency_detection",\n'
          if text.count(module) != 1:
              raise SystemExit("Could not find the GPU dependency test module entry")
          text = text.replace(
              module,
              module + '            "tests.test_amd_gpu_selection",\n',
              1,
          )
          checkup.write_text(text, encoding="utf-8")
          PY

      - name: Commit target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library/sensors/sensors_python.py gtk-checkup.py
          git commit -m "Prefer dedicated AMD GPU for monitoring"
          git push origin HEAD:agent/prefer-discrete-amd-gpu
