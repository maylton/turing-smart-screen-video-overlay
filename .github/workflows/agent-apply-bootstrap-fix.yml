name: Apply runtime bootstrap fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/agent-apply-bootstrap-fix.yml

permissions:
  contents: write

jobs:
  patch-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/runtime-bootstrap-and-amd-diagnostics

      - name: Patch installer and contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          install = Path("install.sh")
          text = install.read_text(encoding="utf-8")

          old_required = '''if [[ ! -f "$SOURCE_DIR/main.py" ]]; then\n  echo "main.py was not found in: $SOURCE_DIR" >&2\n  echo "Run install.sh from the complete project directory." >&2\n  exit 1\nfi\n'''
          new_required = '''REQUIRED_SOURCE_FILES=(\n  main.py\n  configure-gtk.py\n  launcher.py\n  library/i18n.py\n  requirements-gpu-amd.txt\n)\n\nfor relative in "${REQUIRED_SOURCE_FILES[@]}"; do\n  if [[ ! -f "$SOURCE_DIR/$relative" ]]; then\n    echo "Required project file is missing: $SOURCE_DIR/$relative" >&2\n    echo "Update the repository before installing: git fetch origin && git pull --ff-only" >&2\n    exit 1\n  fi\ndone\n'''
          if text.count(old_required) != 1:
              raise SystemExit("Could not locate installer source validation block")
          text = text.replace(old_required, new_required, 1)

          old_import_validation = '''print("Project venv GTK, Pillow, pyserial, Babel and ruamel.yaml imports OK")\n'\n\nPYTHON_ENTRYPOINTS=(\n  configure-gtk.py\n'''
          new_import_validation = '''print("Project venv GTK, Pillow, pyserial, Babel and ruamel.yaml imports OK")\n'\n\n$SUDO env \\\n  PYTHONPATH="$PREFIX${PYTHONPATH:+:$PYTHONPATH}" \\\n  TURING_SMART_SCREEN_LANG="${TURING_SMART_SCREEN_LANG:-}" \\\n  "$PREFIX/venv/bin/python3" -c '\nimport importlib\nfrom library.i18n import active_language\nimportlib.import_module("sitecustomize")\nimportlib.import_module("usercustomize")\nprint(f"Project startup hooks and i18n OK: {active_language()}")\n'\n\nPYTHON_ENTRYPOINTS=(\n  launcher.py\n  configure-gtk.py\n'''
          if text.count(old_import_validation) != 1:
              raise SystemExit("Could not locate installer import validation block")
          text = text.replace(old_import_validation, new_import_validation, 1)

          old_launcher = '''export TURING_SMART_SCREEN_HOME="$PREFIX"\ncd "$PREFIX"\nexec "$PREFIX/venv/bin/python3" "$PREFIX/configure-gtk.py" "\\$@"\n'''
          new_launcher = '''export TURING_SMART_SCREEN_HOME="$PREFIX"\nexport PYTHONPATH="$PREFIX\\${PYTHONPATH:+:\\$PYTHONPATH}"\ncd "$PREFIX"\nexec "$PREFIX/venv/bin/python3" "$PREFIX/launcher.py" "\\$@"\n'''
          if text.count(old_launcher) != 1:
              raise SystemExit("Could not locate native launcher block")
          text = text.replace(old_launcher, new_launcher, 1)
          install.write_text(text, encoding="utf-8")

          checkup = Path("gtk-checkup.py")
          text = checkup.read_text(encoding="utf-8")
          required_marker = '        "configure-gtk.py",\n'
          if text.count(required_marker) != 1:
              raise SystemExit("Could not locate checkup required files")
          text = text.replace(
              required_marker,
              '        "launcher.py",\n' + required_marker,
              1,
          )
          scripts_marker = '        root / "configure-gtk.py",\n'
          if text.count(scripts_marker) != 1:
              raise SystemExit("Could not locate checkup scripts")
          text = text.replace(
              scripts_marker,
              '        root / "launcher.py",\n' + scripts_marker,
              1,
          )
          checkup.write_text(text, encoding="utf-8")

          tests = Path("tests/test_packaging.py")
          text = tests.read_text(encoding="utf-8")
          marker = '''    def test_installer_runs_the_installed_checkup(self):\n'''
          addition = '''    def test_installer_requires_current_gpu_and_translation_files(self):\n        text = (ROOT / "install.sh").read_text(encoding="utf-8")\n        self.assertIn("REQUIRED_SOURCE_FILES=(", text)\n        self.assertIn("library/i18n.py", text)\n        self.assertIn("requirements-gpu-amd.txt", text)\n        self.assertIn("launcher.py", text)\n\n    def test_native_launcher_enables_project_startup_hooks(self):\n        text = (ROOT / "install.sh").read_text(encoding="utf-8")\n        self.assertIn('export PYTHONPATH="$PREFIX', text)\n        self.assertIn('"$PREFIX/launcher.py"', text)\n        self.assertIn("Project startup hooks and i18n OK", text)\n\n        launcher = (ROOT / "launcher.py").read_text(encoding="utf-8")\n        self.assertIn('sys.argv = [str(ENTRY_POINT), *forwarded_args]', launcher)\n        self.assertIn('(\"sitecustomize\", \"usercustomize\")', launcher)\n        self.assertIn('runpy.run_path(str(ENTRY_POINT), run_name="__main__")', launcher)\n\n'''
          if text.count(marker) != 1:
              raise SystemExit("Could not locate packaging test insertion point")
          text = text.replace(marker, addition + marker, 1)
          tests.write_text(text, encoding="utf-8")
          PY

      - name: Commit fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh gtk-checkup.py tests/test_packaging.py
          git commit -m "Fix installed startup hooks and stale source detection"
          git push origin HEAD:fix/runtime-bootstrap-and-amd-diagnostics
