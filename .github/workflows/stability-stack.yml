name: Stability stack

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'install-checked.sh'
      - 'diagnostics*.py'
      - 'gpu-selection*.py'
      - 'theme-backups.py'
      - 'library/display_lifecycle.py'
      - 'library/gpu_*.py'
      - 'library/release_info.py'
      - 'library/theme_editor_backup*.py'
      - 'library/main_app_inline_diagnostics.py'
      - 'library/diagnostics_gtk_i18n.py'
      - 'scripts/installation-report.py'
      - 'tests/test_display_lifecycle.py'
      - 'tests/test_gpu_selection.py'
      - 'tests/test_release_info.py'
      - 'tests/test_theme_editor_backups.py'
      - 'tests/test_packaging.py'
      - '.github/workflows/stability-stack.yml'
  push:
    branches:
      - main
    paths:
      - 'VERSION'
      - 'install-checked.sh'
      - 'diagnostics*.py'
      - 'gpu-selection*.py'
      - 'theme-backups.py'
      - 'library/display_lifecycle.py'
      - 'library/gpu_*.py'
      - 'library/release_info.py'
      - 'library/theme_editor_backup*.py'
      - 'library/main_app_inline_diagnostics.py'
      - 'library/diagnostics_gtk_i18n.py'
      - 'scripts/installation-report.py'
      - 'tests/test_display_lifecycle.py'
      - 'tests/test_gpu_selection.py'
      - 'tests/test_release_info.py'
      - 'tests/test_theme_editor_backups.py'
      - 'tests/test_packaging.py'
      - '.github/workflows/stability-stack.yml'

jobs:
  stability-stack:
    name: Stability stack · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate shell and Python entry points
        run: |
          bash -n install-checked.sh
          python -m py_compile \
            scripts/installation-report.py \
            theme-backups.py \
            gpu-selection.py \
            gpu-selection-gtk.py \
            diagnostics.py \
            diagnostics-gtk.py \
            library/release_info.py \
            library/theme_editor_backups.py \
            library/theme_editor_backup_runtime.py \
            library/display_lifecycle.py \
            library/gpu_selection.py \
            library/gpu_selection_runtime.py \
            library/gpu_diagnostics.py \
            library/main_app_inline_diagnostics.py

      - name: Run stability stack tests
        run: |
          python -m unittest -v \
            tests.test_release_info \
            tests.test_theme_editor_backups \
            tests.test_display_lifecycle \
            tests.test_gpu_selection \
            tests.test_packaging
