name: Temporary i18n integration cleanup

on:
  push:
    branches:
      - feat/i18n-pt-br
    paths:
      - .github/workflows/agent-fix-i18n-integration.yml

permissions:
  contents: write

jobs:
  translate-late-integrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout translation branch
        uses: actions/checkout@v6
        with:
          ref: feat/i18n-pt-br

      - name: Translate widgets added by later integrations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("library/main_app_i18n.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def init_with_i18n(self, application):\n        original_init(self, application)\n        translate_widget_tree(self)\n'''
          new = '''    def init_with_i18n(self, application):\n        original_init(self, application)\n        translate_widget_tree(self)\n\n        # Diagnostics and other optional integrations wrap __init__ after the\n        # i18n layer and may append widgets after the immediate translation.\n        # Translate once more on the GTK idle loop after all wrappers return.\n        def translate_after_integrations():\n            translate_widget_tree(self)\n            return False\n\n        idle_add = getattr(getattr(app, "GLib", None), "idle_add", None)\n        if callable(idle_add):\n            idle_add(translate_after_integrations)\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected one main-app init wrapper, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit integration fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library/main_app_i18n.py
          git commit -m "Translate widgets added by late integrations"
          git push origin HEAD:feat/i18n-pt-br
