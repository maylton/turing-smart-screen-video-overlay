    <!-- Overlays: rings and readouts, fixed geometry in style.css. -->
    <svg id="rings" viewBox="0 0 480 480" aria-hidden="true" data-turing-overlay>
      <defs>
      <linearGradient id="grad-cpu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3b6b"/><stop offset="1" stop-color="#ff9a62"/></linearGradient>
      <linearGradient id="grad-gpu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b6ff4a"/><stop offset="1" stop-color="#2fe08a"/></linearGradient>
      <linearGradient id="grad-ram" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#39d0ff"/><stop offset="1" stop-color="#8a7dff"/></linearGradient>
      </defs>
      <circle class="arc arc-cpu" cx="240" cy="240" r="196" stroke="url(#grad-cpu)" stroke-dasharray="1231.5" stroke-dashoffset="1231.5" data-circumference="1231.5"/>
      <circle class="arc arc-gpu" cx="240" cy="240" r="168" stroke="url(#grad-gpu)" stroke-dasharray="1055.6" stroke-dashoffset="1055.6" data-circumference="1055.6"/>
      <circle class="arc arc-ram" cx="240" cy="240" r="140" stroke="url(#grad-ram)" stroke-dasharray="879.6" stroke-dashoffset="879.6" data-circumference="879.6"/>
    </svg>
    <div id="time" data-turing-overlay>--:--</div>
    <div id="date" data-turing-overlay>--</div>
    <div id="cpu-val" class="val" data-turing-overlay>--%</div>
    <div id="gpu-val" class="val" data-turing-overlay>--%</div>
    <div id="ram-val" class="val" data-turing-overlay>--%</div>
