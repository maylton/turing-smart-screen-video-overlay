<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480,height=480,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>AIO Material Expressive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="aio-screen" aria-label="Monitor do sistema para water cooler">
    <div class="ambient-glow ambient-glow-primary" aria-hidden="true"></div>
    <div class="ambient-glow ambient-glow-tertiary" aria-hidden="true"></div>

    <div class="ui-layer">
      <section class="top-row" aria-label="CPU e GPU">
        <article class="surface-card metric-card card-cpu">
          <header class="metric-header">
            <span class="metric-label">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="6" y="6" width="12" height="12" rx="2"></rect>
                <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"></path>
                <rect x="9" y="9" width="6" height="6" rx="1"></rect>
              </svg>
              CPU
            </span>
            <strong class="load-value cpu-accent" id="cpu-load" data-turing-overlay>--%</strong>
          </header>
          <div class="temperature-row" data-turing-overlay>
            <strong id="cpu-temp">--</strong><span>°C</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <i class="progress-fill fill-cpu" id="cpu-bar" data-turing-overlay></i>
          </div>
        </article>

        <article class="surface-card metric-card card-gpu">
          <header class="metric-header">
            <span class="metric-label">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                <rect x="7" y="8" width="4" height="4" rx="1"></rect>
                <rect x="13" y="8" width="4" height="4" rx="1"></rect>
                <path d="M7 16h10"></path>
              </svg>
              GPU
            </span>
            <strong class="load-value gpu-accent" id="gpu-load" data-turing-overlay>--%</strong>
          </header>
          <div class="temperature-row" data-turing-overlay>
            <strong id="gpu-temp">--</strong><span>°C</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <i class="progress-fill fill-gpu" id="gpu-bar" data-turing-overlay></i>
          </div>
        </article>
      </section>

      <section class="liquid-center" aria-label="Temperatura principal">
        <div class="blob-container" aria-hidden="true">
          <div class="blob-shadow"></div>
          <div class="blob"></div>
        </div>
        <div class="liquid-data">
          <span class="liquid-label" id="liquid-label" data-turing-overlay>LIQUID</span>
          <div class="liquid-value-row" data-turing-overlay>
            <strong id="liquid-temp">--</strong><span>°</span>
          </div>
          <small id="liquid-status" data-turing-overlay>NO SENSOR</small>
        </div>
      </section>

      <section class="bottom-row" aria-label="Memória e resfriamento">
        <article class="surface-card memory-card">
          <span class="round-icon memory-icon" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M5 5h14v14H5z"></path>
              <path d="M8 9h8M8 12h8M8 15h5M3 8h2M3 12h2M3 16h2M19 8h2M19 12h2M19 16h2"></path>
            </svg>
          </span>
          <div class="memory-copy">
            <span>MEMORY</span>
            <strong id="ram-usage" data-turing-overlay>-- GB</strong>
          </div>
        </article>

        <article class="cooling-card">
          <div class="cooling-heading">
            <svg class="fan-icon spin" id="fan-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="2.2"></circle>
              <path d="M12 3c3 0 4.8 2 3.8 4.2C14.8 9.4 12 10 12 10S9.2 8.3 9.5 6C9.8 4 10.5 3 12 3zM21 12c0 3-2 4.8-4.2 3.8C14.6 14.8 14 12 14 12s1.7-2.8 4-2.5C20 9.8 21 10.5 21 12zM12 21c-3 0-4.8-2-3.8-4.2C9.2 14.6 12 14 12 14s2.8 1.7 2.5 4C14.2 20 13.5 21 12 21zM3 12c0-3 2-4.8 4.2-3.8C9.4 9.2 10 12 10 12s-1.7 2.8-4 2.5C4 14.2 3 13.5 3 12z"></path>
            </svg>
            <span id="cooling-label" data-turing-overlay>PUMP</span>
          </div>
          <div class="cooling-value-row">
            <strong id="pump-value" data-turing-overlay>--</strong>
            <span id="pump-unit" data-turing-overlay>RPM</span>
          </div>
        </article>
      </section>
    </div>
  </main>
  <script src="theme.js"></script>
</body>
</html>
