<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480,height=480,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Líquido</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen" aria-label="Líquido">
    <!-- Background (native video): deep water, light rays, bubbles, glass. -->
    <div class="rays"></div>
    <div class="rim-glow"></div>
    <div class="glass"></div>
    <svg class="bubbles" viewBox="0 0 480 480" aria-hidden="true"><circle class="bubble" cx="208" cy="309" r="2"/><circle class="bubble" cx="163" cy="332" r="3"/><circle class="bubble" cx="255" cy="355" r="2.5"/><circle class="bubble" cx="157" cy="326" r="2"/><circle class="bubble" cx="193" cy="333" r="2"/><circle class="bubble" cx="299" cy="307" r="2.5"/><circle class="bubble" cx="264" cy="335" r="2"/><circle class="bubble" cx="254" cy="324" r="2.5"/><circle class="bubble" cx="158" cy="352" r="3"/><circle class="bubble" cx="225" cy="332" r="5"/><circle class="bubble" cx="206" cy="349" r="2.5"/><circle class="bubble" cx="169" cy="334" r="2.5"/><circle class="bubble" cx="217" cy="333" r="2"/><circle class="bubble" cx="252" cy="337" r="4"/><circle class="bubble" cx="272" cy="326" r="3"/><circle class="bubble" cx="234" cy="355" r="3"/><circle class="bubble" cx="392" cy="322" r="1.5"/><circle class="bubble" cx="71" cy="363" r="2"/><circle class="bubble" cx="394" cy="418" r="1.5"/><circle class="bubble" cx="388" cy="341" r="2"/><circle class="bubble" cx="382" cy="380" r="2.5"/><circle class="bubble" cx="397" cy="342" r="2"/><circle class="bubble" cx="383" cy="311" r="2"/><circle class="bubble" cx="415" cy="308" r="2.5"/><circle class="bubble" cx="412" cy="419" r="2"/><circle class="bubble" cx="416" cy="406" r="2"/></svg>
    <svg class="scale" viewBox="0 0 480 480" aria-hidden="true"><line class="tick major" x1="372" y1="366.0" x2="382" y2="366.0"/><line class="tick" x1="372" y1="341.6" x2="378" y2="341.6"/><line class="tick" x1="372" y1="317.2" x2="378" y2="317.2"/><line class="tick" x1="372" y1="292.8" x2="378" y2="292.8"/><line class="tick" x1="372" y1="268.4" x2="378" y2="268.4"/><line class="tick major" x1="372" y1="244.0" x2="382" y2="244.0"/><line class="tick" x1="372" y1="219.6" x2="378" y2="219.6"/><line class="tick" x1="372" y1="195.2" x2="378" y2="195.2"/><line class="tick" x1="372" y1="170.8" x2="378" y2="170.8"/><line class="tick" x1="372" y1="146.4" x2="378" y2="146.4"/><line class="tick major" x1="372" y1="122.0" x2="382" y2="122.0"/><text x="386" y="250">50</text><text x="386" y="128">100</text><text x="386" y="372">0</text></svg>
    <div class="labels">
      <span>GPU</span><span>RAM</span><span>GPU °C</span>
    </div>

    <!-- Overlays. -->
    <svg id="tank" viewBox="0 0 244 244" aria-hidden="true" data-turing-overlay>
      <defs>
        <clipPath id="inner"><circle cx="122" cy="122" r="116"/></clipPath>
        <linearGradient id="liquid-cool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ff2ff"/><stop offset="1" stop-color="#0a5fd8"/></linearGradient>
        <linearGradient id="liquid-hot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd36b"/><stop offset="1" stop-color="#e2361c"/></linearGradient>
      </defs>
      <g clip-path="url(#inner)">
        <g class="level" transform="translate(0 238)">
          <path class="wave back" d="M -4 4.6 L 0 5.0 L 4 4.5 L 8 3.3 L 12 1.5 L 16 -0.5 L 20 -2.5 L 24 -4.0 L 28 -4.9 L 32 -4.9 L 36 -4.1 L 40 -2.7 L 44 -0.8 L 48 1.3 L 52 3.1 L 56 4.4 L 60 5.0 L 64 4.7 L 68 3.7 L 72 2.0 L 76 -0.0 L 80 -2.0 L 84 -3.7 L 88 -4.7 L 92 -5.0 L 96 -4.4 L 100 -3.1 L 104 -1.3 L 108 0.8 L 112 2.7 L 116 4.2 L 120 4.9 L 124 4.9 L 128 4.0 L 132 2.4 L 136 0.5 L 140 -1.5 L 144 -3.3 L 148 -4.5 L 152 -5.0 L 156 -4.6 L 160 -3.5 L 164 -1.7 L 168 0.3 L 172 2.3 L 176 3.9 L 180 4.8 L 184 5.0 L 188 4.3 L 192 2.9 L 196 1.0 L 200 -1.0 L 204 -2.9 L 208 -4.3 L 212 -5.0 L 216 -4.8 L 220 -3.8 L 224 -2.2 L 228 -0.2 L 232 1.8 L 236 3.5 L 240 4.6 L 244 5.0 L 248 4.5 L 248 260 L -4 260 Z"/>
          <path class="wave front" transform="translate(0 6)" d="M -4 -2.4 L 0 0.0 L 4 2.4 L 8 4.4 L 12 5.7 L 16 6.0 L 20 5.3 L 24 3.7 L 28 1.5 L 32 -0.9 L 36 -3.2 L 40 -5.0 L 44 -5.9 L 48 -5.8 L 52 -4.8 L 56 -3.0 L 60 -0.6 L 64 1.8 L 68 4.0 L 72 5.4 L 76 6.0 L 80 5.6 L 84 4.2 L 88 2.1 L 92 -0.3 L 96 -2.7 L 100 -4.6 L 104 -5.8 L 108 -6.0 L 112 -5.1 L 116 -3.5 L 120 -1.2 L 124 1.2 L 128 3.5 L 132 5.1 L 136 6.0 L 140 5.8 L 144 4.6 L 148 2.7 L 152 0.3 L 156 -2.1 L 160 -4.2 L 164 -5.6 L 168 -6.0 L 172 -5.4 L 176 -4.0 L 180 -1.8 L 184 0.6 L 188 3.0 L 192 4.8 L 196 5.8 L 200 5.9 L 204 5.0 L 208 3.2 L 212 0.9 L 216 -1.5 L 220 -3.7 L 224 -5.3 L 228 -6.0 L 232 -5.7 L 236 -4.4 L 240 -2.4 L 244 -0.0 L 248 2.4 L 248 260 L -4 260 Z"/>
        </g>
      </g>
      <path class="gloss" d="M 40 70 A 100 100 0 0 1 112 22" />
    </svg>
    <div id="cpu-temp" data-turing-overlay>--°</div>
    <div id="cpu-sub" data-turing-overlay>CPU --%</div>
    <div id="time" data-turing-overlay>--:--</div>
    <div id="date" data-turing-overlay>--</div>
    <div id="gpu-val" class="val" data-turing-overlay>--%</div>
    <div id="ram-val" class="val" data-turing-overlay>--%</div>
    <div id="gpu-temp" class="val" data-turing-overlay>--°</div>
  </main>
  <script src="theme.js"></script>
</body>
</html>
