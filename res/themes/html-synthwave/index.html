<!doctype html>
<html lang="pt-BR">
<head>

    <div class="date-chip"></div>
    <div class="chips">
      <div class="chip"><span>CPU</span></div>
      <div class="chip"><span>GPU</span></div>
      <div class="chip"><span>RAM</span></div>
    </div>

    <!-- Overlays. -->
    <div id="time" data-turing-overlay>--:--</div>
    <div id="date" data-turing-overlay>--</div>
    <div id="cpu-val" class="val val-cyan" data-turing-overlay>--%</div>
    <div id="gpu-val" class="val val-pink" data-turing-overlay>--%</div>
    <div id="ram-val" class="val val-cyan" data-turing-overlay>--%</div>
    <div id="temps" data-turing-overlay>CPU --° · GPU --°</div>
  </main>
  <script src="theme.js"></script>
</body>
</html>
