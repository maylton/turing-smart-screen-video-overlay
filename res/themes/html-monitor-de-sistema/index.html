<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480,height=480,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Monitor de Sistema</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen" aria-label="Monitor de sistema">
    <div class="glow glow-cyan"></div>
    <div class="glow glow-purple"></div>

    <header class="clock">
    </header>

    <section class="cards">
      <article class="card">
        <div class="card-row">
          <div class="card-label">
            <svg class="icon icon-cpu" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/>
            </svg>
            <span class="card-title">CPU</span>
          </div>
        </div>
      </article>

      <article class="card">
        <div class="card-row">
          <div class="card-label">
            <svg class="icon icon-gpu" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            <span class="card-title">GPU</span>
          </div>
        </div>
      </article>

      <article class="card">
        <div class="card-row">
          <div class="card-label">
            <svg class="icon icon-ram" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/>
            </svg>
            <span class="card-title">RAM</span>
          </div>
        </div>
      </article>
    </section>

    <!-- Dynamic overlays: direct children of the screen, positioned in
         style.css so the visual editor can move them without reflow. -->
    <div id="time" class="time mono" data-turing-overlay>--:--</div>
    <div id="date" class="date" data-turing-overlay>--</div>
    <span id="cpu-temp" class="temp mono" data-turing-overlay><span class="temp-value">--</span><span class="temp-unit">°C</span></span>
    <span id="cpu-usage" class="usage mono tone-cpu" data-turing-overlay>--%</span>
    <div id="cpu-bar" class="track" data-turing-overlay><div class="fill fill-cpu"></div></div>
    <span id="gpu-temp" class="temp mono" data-turing-overlay><span class="temp-value">--</span><span class="temp-unit">°C</span></span>
    <span id="gpu-usage" class="usage mono tone-gpu" data-turing-overlay>--%</span>
    <div id="gpu-bar" class="track" data-turing-overlay><div class="fill fill-gpu"></div></div>
    <span id="ram-amount" class="ram mono" data-turing-overlay><span class="ram-used">--</span><span class="ram-total">/-- GB</span></span>
    <span id="ram-usage" class="usage mono tone-ram" data-turing-overlay>--%</span>
    <div id="ram-bar" class="track" data-turing-overlay><div class="fill fill-ram"></div></div>
  </main>
  <script src="theme.js"></script>
</body>
</html>
