<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480,height=480,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Bauhaus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen" aria-label="Bauhaus">
    <!-- Background (native video): primary shapes, rules, swinging parts. -->
    <div class="sun"></div>
    <div class="quarter"></div>
    <svg class="shapes" viewBox="0 0 480 480" aria-hidden="true">
      <polygon class="triangle" points="318,468 452,468 385,356"/>
      <rect class="block" x="56" y="210" width="368" height="8"/>
    </svg>
    <div class="spinner"><span></span></div>
    <div class="pendulum"></div>
    <div class="slider"></div>
    <div class="rows">
      <div class="row" id="row-cpu"><span class="label">CPU</span><span class="track"></span></div>
      <div class="row" id="row-gpu"><span class="label">GPU</span><span class="track"></span></div>
      <div class="row" id="row-ram"><span class="label">RAM</span><span class="track"></span></div>
    </div>

    <!-- Overlays. -->
    <div id="time" data-turing-overlay>--:--</div>
    <div id="date" data-turing-overlay>--</div>
    <div id="cpu-bar" class="bar" data-turing-overlay><div class="fill"></div></div>
    <div id="gpu-bar" class="bar" data-turing-overlay><div class="fill"></div></div>
    <div id="ram-bar" class="bar" data-turing-overlay><div class="fill"></div></div>
    <div id="cpu-val" class="val" data-turing-overlay>--%</div>
    <div id="gpu-val" class="val" data-turing-overlay>--%</div>
    <div id="ram-val" class="val" data-turing-overlay>--%</div>
    <div id="temps" data-turing-overlay>CPU --° · GPU --°</div>
  </main>
  <script src="theme.js"></script>
</body>
</html>
