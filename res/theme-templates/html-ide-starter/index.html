<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480,height=480,initial-scale=1">
  <!-- Themes are local-only by default. Keep connect-src 'none' unless the
       manifest also requests and documents a reviewed network permission. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>HTML IDE Starter</title>
  <!-- style.css belongs to the author. The editor-managed file is loaded last. -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme-editor-overrides.css">
</head>
<body>
  <!-- Static HTML/CSS stays outside data-turing-overlay and can later be baked
       into a background video. -->
  <main class="screen" aria-label="Exemplo de monitor do sistema">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <p class="eyebrow">TURING SMART SCREEN</p>
    <h1>Meu tema HTML</h1>
    <section class="card card-cpu" aria-hidden="true">
      <span>CPU</span>
    </section>
    <section class="card card-memory" aria-hidden="true">
      <span>RAM</span>
    </section>
    <p class="hint">Edite manifest.json, overlays.json, HTML, CSS e JavaScript.</p>

    <!-- This is an authored/custom overlay. theme.js updates it. The marker is
         mandatory for physical native-video overlay extraction and the editor. -->
    <div id="custom-status" data-turing-overlay>HOST: --</div>
  </main>

  <!-- Load authored behavior before the generated runtime. The generated
       runtime chains window.TuringTheme.update instead of replacing it. -->
  <script src="theme.js"></script>

  <!-- turing-html-editor-widgets:start -->
  <div id="turing-editor-widgets">
    <div id="turing-cpu-temperature-1" class="turing-editor-widget" data-turing-overlay data-turing-generated-widget data-turing-binding="cpu.temperature" data-turing-format="temperature" data-turing-kind="text" data-turing-component="cpu-temperature">49°C</div>
    <div id="turing-cpu-usage-bar-1" class="turing-editor-widget" data-turing-overlay data-turing-generated-widget data-turing-binding="cpu.usage" data-turing-format="bar-percent" data-turing-kind="bar" data-turing-component="cpu-usage-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62"><div data-turing-bar-fill aria-hidden="true"></div></div>
    <div id="turing-ram-usage-1" class="turing-editor-widget" data-turing-overlay data-turing-generated-widget data-turing-binding="memory.usage" data-turing-format="percent" data-turing-kind="text" data-turing-component="ram-usage">45%</div>
  </div>
  <script src="theme-editor-widgets.js"></script>
  <!-- turing-html-editor-widgets:end -->
</body>
</html>
