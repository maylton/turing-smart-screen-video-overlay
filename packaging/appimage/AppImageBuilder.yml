# AppImage packaging only. Application/runtime source remains the current main code.
version: 1

script:
  - |
    set -eux
    # The source checkout is mounted at /src by the container build helper.
    # Do not use git rev-parse here: git worktrees contain a .git pointer to a
    # host-only path that is intentionally not mounted inside the container.
    ROOT="/src"
    rm -rf "$TARGET_APPDIR"
    mkdir -p \
      "$TARGET_APPDIR/usr/bin" \
      "$TARGET_APPDIR/usr/share/turing-smart-screen" \
      "$TARGET_APPDIR/usr/share/applications" \
      "$TARGET_APPDIR/usr/share/icons/hicolor/128x128/apps" \
      "$TARGET_APPDIR/usr/share/metainfo"

    rsync -a \
      --delete \
      --delete-excluded \
      --filter "merge $ROOT/packaging/runtime-rsync-filter.txt" \
      "$ROOT/" "$TARGET_APPDIR/usr/share/turing-smart-screen/"

    install -Dm755 \
      "$ROOT/packaging/appimage/turing-smart-screen-appimage" \
      "$TARGET_APPDIR/usr/bin/turing-smart-screen-appimage"

    install -Dm644 \
      "$ROOT/packaging/flatpak/io.github.turing.SmartScreen.desktop" \
      "$TARGET_APPDIR/usr/share/applications/io.github.turing.SmartScreen.desktop"

    install -Dm644 \
      "$ROOT/packaging/flatpak/io.github.turing.SmartScreen.metainfo.xml" \
      "$TARGET_APPDIR/usr/share/metainfo/io.github.turing.SmartScreen.metainfo.xml"

    install -Dm644 \
      "$ROOT/res/icons/monitor-icon-17865/128.png" \
      "$TARGET_APPDIR/usr/share/icons/hicolor/128x128/apps/io.github.turing.SmartScreen.png"

    printf '%s\n' "${APP_BUILD_ID:-${APP_VERSION:-development}}" \
      > "$TARGET_APPDIR/usr/share/turing-smart-screen/.appimage-payload-id"

AppDir:
  path: ./AppDir

  app_info:
    id: io.github.turing.SmartScreen
    name: Turing Smart Screen
    icon: io.github.turing.SmartScreen
    version: !ENV ${APP_VERSION}
    exec: usr/bin/turing-smart-screen-appimage
    exec_args: $@

  apt:
    arch: amd64
    sources:
      - sourceline: deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble main universe
        key_url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C
      - sourceline: deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-updates main universe
        key_url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C
      - sourceline: deb [arch=amd64] http://security.ubuntu.com/ubuntu noble-security main universe
        key_url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C

    include:
      - bash
      - coreutils
      - python3
      - python3-pip
      - python3-venv
      - python3-gi
      - python3-tk
      - gir1.2-gtk-4.0
      - gir1.2-adw-1
      - gir1.2-webkit-6.0
      - gir1.2-webkit2-4.1
      - libgtk-4-1
      - libadwaita-1-0
      - libwebkitgtk-6.0-4
      - libwebkit2gtk-4.1-0
      - ffmpeg
      - libusb-1.0-0
      - libdrm2
      - libdrm-amdgpu1
      - libdrm-common
      - fonts-dejavu-core

    exclude: []

  after_bundle: |
    set -eux
    ROOT="/src"
    RUNTIME_REQUIREMENTS="$(mktemp)"

    # PyInstaller is a build-time tool and does not belong in the runtime image.
    grep -v -E '^[[:space:]]*pyinstaller([[:space:]~=<>]|$)' \
      "$ROOT/requirements.txt" > "$RUNTIME_REQUIREMENTS"

    python3 -m pip install \
      --break-system-packages \
      --no-cache-dir \
      --ignore-installed \
      --prefix=/usr \
      --root="$TARGET_APPDIR" \
      -r "$RUNTIME_REQUIREMENTS"

    python3 -m pip install \
      --break-system-packages \
      --no-cache-dir \
      --ignore-installed \
      --prefix=/usr \
      --root="$TARGET_APPDIR" \
      -r "$ROOT/requirements-gpu-amd.txt"

    rm -f "$RUNTIME_REQUIREMENTS"

    # Byte-compile with the builder's matching Ubuntu 24.04 Python. The final
    # executable is smoke-tested from inside the finished AppImage in CI/local build.
    python3 -m compileall -q \
      "$TARGET_APPDIR/usr/share/turing-smart-screen/library"

  runtime:
    env:
      PYTHONHOME: '${APPDIR}/usr'
      PYTHONNOUSERSITE: '1'
      PYTHONPATH: '${APPDIR}/usr/lib/python3.12:${APPDIR}/usr/lib/python3.12/lib-dynload:${APPDIR}/usr/lib/python3.12/site-packages:${APPDIR}/usr/local/lib/python3.12/dist-packages'
      TURING_SMART_SCREEN_PYTHON: '${APPDIR}/usr/bin/python3'
      AMDGPU_ASIC_ID_TABLE_PATHS: '${APPDIR}/usr/share/libdrm'

AppImage:
  arch: x86_64
  update-information: None
  sign-key: None
