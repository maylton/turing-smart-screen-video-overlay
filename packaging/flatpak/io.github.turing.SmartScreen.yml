app-id: io.github.turing.SmartScreen
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: turing-smart-screen

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Serial-backed displays appear as /dev/ttyUSB* or /dev/ttyACM* while
  # newer TURZX models use raw USB. Flatpak has no narrower static grant that
  # covers both classes, so the first GitHub release uses all devices.
  - --device=all
  - --filesystem=xdg-videos:rw
  - --filesystem=xdg-download:ro
  # KDE StatusNotifier registration needs to talk to the host watcher. The
  # packaged copy uses the app's own D-Bus namespace, which Flatpak permits by
  # default, instead of requesting broad org.kde.* ownership.
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: python-runtime-dependencies
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - >-
        python3 -m pip install --prefix=/app --no-cache-dir
        'pyserial>=3.5,<4'
        'PyYAML>=6,<7'
        'psutil>=7,<8'
        'pystray>=0.19,<0.20'
        'babel>=2.17,<3'
        'ruamel.yaml>=0.18,<0.20'
        'sv-ttk>=2.6,<3'
        'tkinter-tooltip>=3.1,<4'
        'uptime>=3,<4'
        'ping3>=5,<6'
        'pyusb>=1.3,<2'
        'pycryptodome>=3.23,<4'
        'requests>=2.32,<3'
        'Pillow>=11,<13'
        'numpy>=2,<3'
        'pyamdgpuinfo>=2.1.8,<2.2'
        'GPUtil @ git+https://github.com/mathoudebine/gputil.git@1.4.1-py3.13'

  - name: turing-smart-screen
    buildsystem: simple
    build-commands:
      - install -d /app/share/turing-smart-screen
      - cp -a . /app/share/turing-smart-screen/
      - rm -rf /app/share/turing-smart-screen/.git /app/share/turing-smart-screen/.github
      - >-
        python3 -c 'from pathlib import Path; p=Path("/app/share/turing-smart-screen/configure_gtk_app.py"); s=p.read_text(encoding="utf-8"); old="self.bus_name = f\"org.kde.StatusNotifierItem-{os.getpid()}-1\""; new="self.bus_name = (os.environ.get(\"FLATPAK_ID\") + \".StatusNotifierItem\" if os.environ.get(\"FLATPAK_ID\") else f\"org.kde.StatusNotifierItem-{os.getpid()}-1\")"; assert old in s, "StatusNotifier bus name hook not found"; p.write_text(s.replace(old, new, 1), encoding="utf-8")'
      - |-
        python3 - <<'PY'
        from pathlib import Path

        path = Path("/app/share/turing-smart-screen/configure-gtk.py")
        source = path.read_text(encoding="utf-8")

        old_refresh = '''    def refresh_runtime_status(self):
            update_runtime_status(self)
            return True
        '''
        new_refresh = '''    def refresh_runtime_status(self):
            update_runtime_status(self)
            try:
                self.refresh_overview()
            except Exception:
                pass
            return True
        '''
        assert old_refresh in source, "runtime status refresh hook not found"
        source = source.replace(old_refresh, new_refresh, 1)

        old_start = '''    def start_monitor(self, *_args):
            state = self.runtime_controller.state()
        '''
        new_start = '''    def start_monitor(self, *_args):
            if getattr(self, "detection_running", False):
                if not getattr(self, "monitor_start_waiting_for_detection", False):
                    self.monitor_start_waiting_for_detection = True
                    self.toast("Waiting for display detection to finish…")

                    def retry_start_after_detection():
                        if getattr(self, "detection_running", False):
                            return True
                        self.monitor_start_waiting_for_detection = False
                        self.start_monitor()
                        return False

                    app.GLib.timeout_add(250, retry_start_after_detection)
                return

            existing = getattr(self, "monitor_process", None)
            if existing is not None and existing.poll() is None:
                self.toast("Monitor is already starting")
                self.refresh_overview()
                return

            state = self.runtime_controller.state()
        '''
        assert old_start in source, "monitor start hook not found"
        source = source.replace(old_start, new_start, 1)

        old_launch = '''        self.toast("Monitor is starting")
            app.GLib.timeout_add(350, self.finish_monitor_start)
        '''
        new_launch = '''        self.monitor_start_deadline = time.monotonic() + 10.0
            self.toast("Monitor is starting")
            app.GLib.timeout_add(350, self.finish_monitor_start)
        '''
        assert old_launch in source, "monitor launch status hook not found"
        source = source.replace(old_launch, new_launch, 1)

        old_finish = '''    def finish_monitor_start(self):
            process = self.monitor_process
            if process is not None and process.poll() is not None:
                self.toast(f"Monitor exited with status {process.returncode}")
                reap_monitor_child(self, timeout=0.0)
                self.monitor_process = None
            self.refresh_overview()
            return False
        '''
        new_finish = '''    def finish_monitor_start(self):
            process = self.monitor_process
            state = self.runtime_controller.state()

            if state.monitor_running:
                self.refresh_overview()
                return False

            if process is not None and process.poll() is not None:
                self.toast(f"Monitor exited with status {process.returncode}")
                reap_monitor_child(self, timeout=0.0)
                self.monitor_process = None
                self.refresh_overview()
                return False

            self.refresh_overview()
            deadline = float(getattr(self, "monitor_start_deadline", 0.0) or 0.0)
            if process is not None and process.poll() is None and time.monotonic() < deadline:
                return True

            if process is not None and process.poll() is None:
                try:
                    process.terminate()
                    process.wait(timeout=2.0)
                except Exception:
                    try:
                        process.kill()
                    except Exception:
                        pass
                reap_monitor_child(self, timeout=0.0)
                self.monitor_process = None
                self.toast("Monitor startup timed out; try Start Monitor again")
                self.refresh_overview()
            return False
        '''
        assert old_finish in source, "monitor startup completion hook not found"
        source = source.replace(old_finish, new_finish, 1)

        path.write_text(source, encoding="utf-8")
        PY
      - install -Dm755 packaging/flatpak/turing-smart-screen-flatpak /app/bin/turing-smart-screen
      - install -Dm644 packaging/flatpak/io.github.turing.SmartScreen.desktop /app/share/applications/io.github.turing.SmartScreen.desktop
      - install -Dm644 packaging/flatpak/io.github.turing.SmartScreen.metainfo.xml /app/share/metainfo/io.github.turing.SmartScreen.metainfo.xml
      - install -Dm644 res/icons/monitor-icon-17865/64.png /app/share/icons/hicolor/64x64/apps/io.github.turing.SmartScreen.png
      - install -Dm644 res/icons/monitor-icon-17865/128.png /app/share/icons/hicolor/128x128/apps/io.github.turing.SmartScreen.png
      - python3 -m compileall -q /app/share/turing-smart-screen/library
      - python3 -m py_compile /app/share/turing-smart-screen/configure-gtk.py /app/share/turing-smart-screen/configure_gtk_app.py /app/share/turing-smart-screen/main.py
    sources:
      - type: dir
        path: ../..
