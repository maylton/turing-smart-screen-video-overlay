app-id: io.github.turing.SmartScreen
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: turing-smart-screen

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Serial-backed displays appear as /dev/ttyUSB* or /dev/ttyACM* while
  # newer TURZX models use raw USB. Flatpak has no narrower static grant that
  # covers both classes, so the first GitHub release uses all devices.
  - --device=all
  - --filesystem=xdg-videos:rw
  - --filesystem=xdg-download:ro
  # KDE StatusNotifier registration needs to talk to the host watcher. The
  # packaged copy uses the app's own D-Bus namespace, which Flatpak permits by
  # default, instead of requesting broad org.kde.* ownership.
  - --talk-name=org.kde.StatusNotifierWatcher
  # libdrm normally looks for /usr/share/libdrm/amdgpu.ids. The GNOME runtime
  # does not ship that data file at the hard-coded location, so bundle the
  # upstream database under /app and point modern libdrm at it explicitly.
  - --env=AMDGPU_ASIC_ID_TABLE_PATH=/app/share/libdrm/amdgpu.ids

modules:
  - name: amdgpu-id-database
    buildsystem: simple
    build-commands:
      - install -Dm644 data/amdgpu.ids /app/share/libdrm/amdgpu.ids
    sources:
      - type: archive
        url: https://dri.freedesktop.org/libdrm/libdrm-2.4.134.tar.xz
        sha256: ac5e74d157830eb8bee44c6a6bf3ad49774ef0dd2a72bdad74a8f20308b52a95

  - name: python-runtime-dependencies
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - >-
        python3 -m pip install --prefix=/app --no-cache-dir
        'pyserial>=3.5,<4'
        'PyYAML>=6,<7'
        'psutil>=7,<8'
        'pystray>=0.19,<0.20'
        'babel>=2.17,<3'
        'ruamel.yaml>=0.18,<0.20'
        'sv-ttk>=2.6,<3'
        'tkinter-tooltip>=3.1,<4'
        'uptime>=3,<4'
        'ping3>=5,<6'
        'pyusb>=1.3,<2'
        'pycryptodome>=3.23,<4'
        'requests>=2.32,<3'
        'Pillow>=11,<13'
        'numpy>=2,<3'
        'pyamdgpuinfo>=2.1.8,<2.2'
        'GPUtil @ git+https://github.com/mathoudebine/gputil.git@1.4.1-py3.13'

  - name: turing-smart-screen
    buildsystem: simple
    build-commands:
      - install -d /app/share/turing-smart-screen
      - cp -a . /app/share/turing-smart-screen/
      - rm -rf /app/share/turing-smart-screen/.git /app/share/turing-smart-screen/.github
      - >-
        python3 -c 'from pathlib import Path; p=Path("/app/share/turing-smart-screen/configure_gtk_app.py"); s=p.read_text(encoding="utf-8"); old="self.bus_name = f\"org.kde.StatusNotifierItem-{os.getpid()}-1\""; new="self.bus_name = (os.environ.get(\"FLATPAK_ID\") + \".StatusNotifierItem\" if os.environ.get(\"FLATPAK_ID\") else f\"org.kde.StatusNotifierItem-{os.getpid()}-1\")"; assert old in s, "StatusNotifier bus name hook not found"; p.write_text(s.replace(old, new, 1), encoding="utf-8")'
      - |-
        python3 - <<'PY'
        from pathlib import Path

        path = Path("/app/share/turing-smart-screen/configure-gtk.py")
        source = path.read_text(encoding="utf-8")

        replacements = [
            ('    def refresh_runtime_status(self):\n        update_runtime_status(self)\n        return True\n', '    def refresh_runtime_status(self):\n        update_runtime_status(self)\n        try:\n            self.refresh_overview()\n        except Exception:\n            pass\n        return True\n'),
            ('    def start_monitor(self, *_args):\n        state = self.runtime_controller.state()\n', '    def start_monitor(self, *_args):\n        if getattr(self, "detection_running", False):\n            if not getattr(self, "monitor_start_waiting_for_detection", False):\n                self.monitor_start_waiting_for_detection = True\n                self.toast("Waiting for display detection to finish…")\n\n                def retry_start_after_detection():\n                    if getattr(self, "detection_running", False):\n                        return True\n                    self.monitor_start_waiting_for_detection = False\n                    self.start_monitor()\n                    return False\n\n                app.GLib.timeout_add(250, retry_start_after_detection)\n            return\n\n        existing = getattr(self, "monitor_process", None)\n        if existing is not None and existing.poll() is None:\n            self.toast("Monitor is already starting")\n            self.refresh_overview()\n            return\n\n        state = self.runtime_controller.state()\n'),
            ('        self.toast("Monitor is starting")\n        app.GLib.timeout_add(350, self.finish_monitor_start)\n', '        self.monitor_start_deadline = time.monotonic() + 10.0\n        self.toast("Monitor is starting")\n        app.GLib.timeout_add(350, self.finish_monitor_start)\n'),
            ('    def finish_monitor_start(self):\n        process = self.monitor_process\n        if process is not None and process.poll() is not None:\n            self.toast(f"Monitor exited with status {process.returncode}")\n            reap_monitor_child(self, timeout=0.0)\n            self.monitor_process = None\n        self.refresh_overview()\n        return False\n', '    def finish_monitor_start(self):\n        process = self.monitor_process\n        state = self.runtime_controller.state()\n\n        if state.monitor_running:\n            self.refresh_overview()\n            return False\n\n        if process is not None and process.poll() is not None:\n            self.toast(f"Monitor exited with status {process.returncode}")\n            reap_monitor_child(self, timeout=0.0)\n            self.monitor_process = None\n            self.refresh_overview()\n            return False\n\n        self.refresh_overview()\n        deadline = float(getattr(self, "monitor_start_deadline", 0.0) or 0.0)\n        if process is not None and process.poll() is None and time.monotonic() < deadline:\n            return True\n\n        if process is not None and process.poll() is None:\n            try:\n                process.terminate()\n                process.wait(timeout=2.0)\n            except Exception:\n                try:\n                    process.kill()\n                except Exception:\n                    pass\n            reap_monitor_child(self, timeout=0.0)\n            self.monitor_process = None\n            self.toast("Monitor startup timed out; try Start Monitor again")\n            self.refresh_overview()\n        return False\n'),
        ]

        for old, new in replacements:
            if old not in source:
                raise AssertionError(f"Flatpak UI startup hook not found: {old.splitlines()[0]}")
            source = source.replace(old, new, 1)

        path.write_text(source, encoding="utf-8")
        PY
      - |-
        python3 - <<'PY'
        from pathlib import Path

        dashboard = Path("/app/share/turing-smart-screen/library/main_app_dashboard_polish.py")
        source = dashboard.read_text(encoding="utf-8")
        old = '''        apply_button = Gtk.Button(
            label="Apply + Start",
            icon_name="media-playback-start-symbolic",
        )
        apply_button.add_css_class("suggested-action")
        apply_button.set_tooltip_text("Apply, sync video, then start the monitor")
        apply_button.connect(
            "clicked",
            lambda *_: _call_if_available(
                self,
                "apply_current_theme_sync_and_start",
                "Apply + Sync is available from the Themes page",
            ),
        )
        attach_button(apply_button, 2, 0)
'''
        new = '''        start_button = Gtk.Button(
            label="Start monitor",
            icon_name="media-playback-start-symbolic",
        )
        start_button.add_css_class("suggested-action")
        start_button.set_tooltip_text("Start the monitor using the active theme")
        start_button.set_action_name("win.start-monitor")
        attach_button(start_button, 2, 0)
'''
        if old not in source:
            raise AssertionError("Flatpak dashboard Start button hook not found")
        dashboard.write_text(source.replace(old, new, 1), encoding="utf-8")

        runtime = Path("/app/share/turing-smart-screen/library/runtime.py")
        source = runtime.read_text(encoding="utf-8")
        old = '''        else:
            process_options["start_new_session"] = True
'''
        new = '''        else:
            # Keep the monitor in the Flatpak application's process group so a
            # real terminal interrupt/application shutdown cannot orphan it.
            # Native installs retain the historical detached-session behavior.
            process_options["start_new_session"] = not bool(os.environ.get("FLATPAK_ID"))
'''
        if old not in source:
            raise AssertionError("Flatpak monitor process-group hook not found")
        runtime.write_text(source.replace(old, new, 1), encoding="utf-8")

        sensors = Path("/app/share/turing-smart-screen/library/sensors/sensors_python.py")
        source = sensors.read_text(encoding="utf-8")
        old = '''class GpuAmd(sensors.Gpu):
    selected_index = -1
'''
        new = '''class GpuAmd(sensors.Gpu):
    selected_index = -1
    selected_gpu = None
'''
        if old not in source:
            raise AssertionError("AMD GPU cache class hook not found")
        source = source.replace(old, new, 1)

        old = '''        if GpuAmd.selected_index < 0:
            GpuAmd.selected_index = GpuAmd.preferred_linux_gpu_index()
        if GpuAmd.selected_index < 0:
            raise RuntimeError("No AMD GPU was detected")

        return pyamdgpuinfo.get_gpu(GpuAmd.selected_index)
'''
        new = '''        if GpuAmd.selected_index < 0:
            GpuAmd.selected_index = GpuAmd.preferred_linux_gpu_index()
        if GpuAmd.selected_index < 0:
            raise RuntimeError("No AMD GPU was detected")

        if GpuAmd.selected_gpu is None:
            GpuAmd.selected_gpu = pyamdgpuinfo.get_gpu(GpuAmd.selected_index)
        return GpuAmd.selected_gpu
'''
        if old not in source:
            raise AssertionError("AMD GPU cache lookup hook not found")
        source = source.replace(old, new, 1)

        old = '''                    selected_gpu = pyamdgpuinfo.get_gpu(selected_index)
                    try:
'''
        new = '''                    selected_gpu = pyamdgpuinfo.get_gpu(selected_index)
                    GpuAmd.selected_gpu = selected_gpu
                    try:
'''
        if old not in source:
            raise AssertionError("AMD GPU cache selection hook not found")
        source = source.replace(old, new, 1)
        sensors.write_text(source, encoding="utf-8")
        PY
      - install -Dm755 packaging/flatpak/turing-smart-screen-flatpak /app/bin/turing-smart-screen
      - install -Dm644 packaging/flatpak/io.github.turing.SmartScreen.desktop /app/share/applications/io.github.turing.SmartScreen.desktop
      - install -Dm644 packaging/flatpak/io.github.turing.SmartScreen.metainfo.xml /app/share/metainfo/io.github.turing.SmartScreen.metainfo.xml
      - install -Dm644 res/icons/monitor-icon-17865/64.png /app/share/icons/hicolor/64x64/apps/io.github.turing.SmartScreen.png
      - install -Dm644 res/icons/monitor-icon-17865/128.png /app/share/icons/hicolor/128x128/apps/io.github.turing.SmartScreen.png
      - python3 -m compileall -q /app/share/turing-smart-screen/library
      - python3 -m py_compile /app/share/turing-smart-screen/configure-gtk.py /app/share/turing-smart-screen/configure_gtk_app.py /app/share/turing-smart-screen/main.py
    sources:
      - type: dir
        path: ../..
